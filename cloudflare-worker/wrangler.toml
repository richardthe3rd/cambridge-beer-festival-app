name = "cbf-data-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# The worker will be available at: https://cbf-data-proxy.<your-subdomain>.workers.dev
# You can also add a custom domain route if desired

[vars]
ENVIRONMENT = "production"

# "My festival" aggregate storage (D1 — reviews, tastings, bookmarks).
#
# DISABLED until the database is provisioned in the Cloudflare account.
#
# This block previously carried a placeholder `database_id` of all zeroes. That
# is not deploy-neutral: Cloudflare validates every binding when the script is
# uploaded, so `wrangler deploy` failed with
#
#   D1 binding 'RATINGS_DB' references database
#   '00000000-0000-0000-0000-000000000000' which was not found. [code: 10181]
#
# and took the whole worker down with it — including the CORS data proxy, which
# has nothing to do with D1. Tests never caught this because the vitest pool and
# `wrangler dev` use a simulated local D1 that ignores the id entirely.
#
# With the binding absent, `env.RATINGS_DB` is undefined and the /v1alpha review
# routes return 503 UNAVAILABLE / STORAGE_UNCONFIGURED (see `reviews.ts`), which
# is the documented degraded mode. The proxy, /health and /festivals.json are
# unaffected.
#
# To enable the review API, provision the database and restore the binding:
#
#   wrangler d1 create cbf-myfestival        # → returns the real database_id
#   # uncomment the block below and paste the id into database_id
#   wrangler d1 migrations apply cbf-myfestival --remote
#
# The API token needs D1:Edit in addition to its Workers/Pages scopes.
# Tests keep their simulated D1 either way — it is declared in
# `vitest.config.js`, not here.
#
# [[d1_databases]]
# binding = "RATINGS_DB"
# database_name = "cbf-myfestival"
# database_id = "<paste the id from `wrangler d1 create`>"
# migrations_dir = "migrations"
