version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      dart-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      root-npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /cloudflare-worker
    schedule:
      interval: weekly
      day: monday
      time: '06:35'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # TypeScript is held at 5.x here. openapi-typescript@7.13.0 — still the
    # latest — peer-requires `typescript: ^5.x`, so a major bump produces a
    # tree npm cannot resolve and every `npm ci` in CI fails. Without this,
    # the grouped update pulled TypeScript 7.x and wedged the worker
    # dependabot PR from 2026-06-15 onward (#440), failing weekly.
    # Remove this ignore once openapi-typescript supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      worker-npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: '06:40'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      functions-npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: '06:45'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      scripts-npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:50'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      devcontainer-dependencies:
        patterns:
          - '*'
