name: cambridge_beer_festival
description: A Flutter app for Cambridge Beer Festival - browse beers, ciders, meads, and more.
publish_to: 'none'
version: 2026.7.1+2026072401

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  url_launcher: ^6.2.2
  share_plus: ^13.3.0
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  package_info_plus: ^10.2.1
  collection: ^1.18.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  uuid: ^4.6.0
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  build_runner: ^2.16.0
  url_launcher_platform_interface: ^2.3.0
  package_info_plus_platform_interface: ^4.1.0
  plugin_platform_interface: ^2.1.7
  flutter_launcher_icons: ^0.14.3
  dart_code_linter: ^4.2.1

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: false
  image_path: 'web/icons/Icon-512.png'
  min_sdk_android: 21
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'web/icons/Icon-512.png'

flutter:
  uses-material-design: true
  assets:
    - assets/
    # Bundled so `google_fonts` resolves the app's typefaces from assets rather
    # than fetching them from fonts.gstatic.com at runtime. This makes golden
    # tests deterministic (see test/flutter_test_config.dart) and removes a
    # network round-trip from first paint. Only the variants buildAppTextTheme
    # actually asks for are shipped. This entry covers the whole directory, so
    # adding a weight means dropping the .ttf into assets/fonts/ — no edit here.
    # The directory also holds the OFL licence texts. See docs/code/fonts.md.
    - assets/fonts/
